shell fish

allow_remote_control yes

# set padding in pixels
padding_top 30

# the font family used by kitty
font_family jetbrainsmono nerd font

# the font size (in pts)
font_size 11.0

# Render Nerd Font codicons (warning, claude, tmux) centered + full-cell
symbol_map U+E5FA-U+E6B7,U+EA60-U+EC1E,U+EC80-U+ECAB Symbols Nerd Font Mono

# Performance (Great for Fedora/Wayland)
repaint_delay 10
input_delay 3
sync_to_monitor yes
linux_display_server wayland
# Remove the global hide and try this specific one
wayland_titlebar_color background
hide_window_decorations yes
hide_window_decorations full-windowsystem-ui

