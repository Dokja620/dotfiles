##### Default shell #####
if-shell "command -v fish" "set -g default-command fish"

##### Keybindings #####
unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-p
set -g mouse on

# Pane navigation
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

##### Status bar on top #####
set-option -g status-position top

##### TPM plugin manager #####
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# Status bar (no background, clean colors)
set -g status-style "bg=default,fg=#a6adc8"

# Status content
set -g status-left " "
set -g status-interval 5
set -g status-right-length 120
set -g status-right "#{@claude_all}#[fg=#b4befe,bold] tmux #[fg=#40a02b]on "

# Window titles
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#b4befe,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#b4befe"

# Messages
set -g message-style "fg=#cdd6f4,bg=default"
set -g message-command-style "fg=#a6e3a1,bg=default"

# Window styles
setw -g window-status-style "bg=default"
setw -g window-status-current-style "bg=default"

# redraw status on attach/session switch so claude states show immediately
set-hook -g client-attached "refresh-client -S"
set-hook -g client-session-changed "refresh-client -S"

# prune claude status when a session is killed
set-hook -g session-closed "run-shell -b \"bash ~/.tmux/claude-status-update.sh prune\""

# manual claude status reload (prefix + R)
bind R run-shell -b "bash ~/.tmux/claude-status-update.sh prune"
