##### Default shell #####
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

##### Keybindings #####
unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

set -g prefix C-p
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane navigation
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# New windows / splits open in the current pane's folder
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

##### Status bar on top #####
set-option -g status-position top
set -g status-style "bg=default,fg=#a6adc8"
set -g status-interval 5
set -g status-left-length 80
set -g status-right-length 160

# Left: session · current folder (~ shortened, last 38 chars) · git branch
set -g status-left " #[fg=#89b4fa] #[fg=#cdd6f4]#{=|-38|…:#{s|/home/axelrevana|~|:pane_current_path}}#[fg=#a6e3a1]#(cd '#{pane_current_path}' 2>/dev/null && b=$(git branch --show-current 2>/dev/null) && [ -n \"$b\" ] && printf '   %s' \"$b\") #[fg=#45475a]│ "

# Right: claude state per session · clock
set -g status-right "#{E:@claude_all}#[fg=#b4befe,bold] tmux #[fg=#40a02b]on "

# Windows: index · folder name (claude icon when claude runs there)
setw -g window-status-format         "#[fg=#6c7086] #I #{?#{==:#{pane_current_command},claude},#[fg=#fab387],#W} "
setw -g window-status-current-format "#[fg=#b4befe,bold] #I #{?#{==:#{pane_current_command},claude},#[fg=#fab387],#W} "
setw -g window-status-style "bg=default"
setw -g window-status-current-style "bg=default"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#b4befe"

# Messages
set -g message-style "fg=#cdd6f4,bg=default"
set -g message-command-style "fg=#a6e3a1,bg=default"

##### Claude status hooks #####
set-hook -g client-attached "refresh-client -S"
set-hook -g client-session-changed "refresh-client -S"
set-hook -g session-closed "run-shell -b \"bash /home/axelrevana/.tmux/claude-status-update.sh prune\""
bind R run-shell -b "bash /home/axelrevana/.tmux/claude-status-update.sh prune"
